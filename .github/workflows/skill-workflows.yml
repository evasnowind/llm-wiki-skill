name: skill-workflows

on:
  pull_request:
    paths:
      - 'SKILL.md'
      - 'scripts/**'
      - 'templates/**'
      - 'tests/js/skill-*.test.js'
      - 'tests/run-skill-workflows.js'
      - 'install.sh'
      - '.github/workflows/skill-workflows.yml'
  push:
    branches: [main, 'codex/**']
    paths:
      - 'SKILL.md'
      - 'scripts/**'
      - 'templates/**'
      - 'tests/js/skill-*.test.js'
      - 'tests/run-skill-workflows.js'
      - 'install.sh'
      - '.github/workflows/skill-workflows.yml'

permissions:
  contents: read

jobs:
  skill-workflows:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test installed Skill without npm dependencies
        run: node tests/run-skill-workflows.js
